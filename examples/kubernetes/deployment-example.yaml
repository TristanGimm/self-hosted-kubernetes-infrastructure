apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
  namespace: example-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: example-app

  template:
    metadata:
      labels:
        app: example-app

    spec:
      containers:
        - name: example-app
          image: nginx:alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
