apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://example.com/repository.git
    targetRevision: main
    path: kubernetes/example-app

  destination:
    server: https://kubernetes.default.svc
    namespace: example-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
